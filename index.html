<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LV.26 — JACOB'S INVENTORY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink: #f6a0db; --teal: #00efc3; --periwinkle: #95b0ec; --crimson: #f12454;
    --pale: #feebff; --ink: #0a0a12; --goldy:#e8c95a;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; min-height:100%; background:#fff; color:var(--ink);
    font-family:'Space Mono', monospace;
    display:flex; align-items:center; justify-content:center; padding:36px 12px;
  }
  body{
    background:
      radial-gradient(circle at 10% 10%, rgba(246,160,219,.4), transparent 35%),
      radial-gradient(circle at 95% 90%, rgba(0,239,195,.35), transparent 40%),
      #fff;
  }
  .console{ width:min(94vw,480px); background:#fff; padding:16px 16px 20px; position:relative; }
  .console.frame-2{ border:3px solid var(--ink); }
  .console.frame-2::before{
    content:''; position:absolute; inset:-13px; z-index:-1;
    background-image:
      repeating-linear-gradient(45deg, var(--ink) 0 9px, transparent 0 18px),
      repeating-linear-gradient(-45deg, var(--ink) 0 9px, transparent 0 18px);
    background-color:#fff;
  }

  .titlebar{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
    border-bottom:2px dashed var(--pink); padding-bottom:12px; margin-bottom:14px; margin-top: 6px; }
  h1{ font-family:'Press Start 2P', monospace; font-size:12px; line-height:1.7; margin:0; color:var(--ink);
    text-shadow: 2px 0 var(--crimson), -2px 0 var(--teal); }
  .subtitle{ font-size:13px; color:#8a7d92; margin-top:4px; letter-spacing:1px; }
  .lvbadge{ font-family:'Press Start 2P', monospace; font-size:10px; color:#fff;
    background: linear-gradient(135deg, var(--teal), var(--pink));
    padding:7px 9px; white-space:nowrap; flex-shrink:0; box-shadow: 3px 3px 0 var(--crimson); }
  .xprow{ display:flex; align-items:center; gap:8px; margin-bottom:8px;
    font-family:'Press Start 2P', monospace; font-size:9px; color:var(--ink); }
  .xpbar{ flex:1; height:14px; background:#f2f2f2; border:2px solid var(--ink); position:relative; overflow:hidden; }
  .xpbar-fill{ height:100%; width:0%; transition:width .5s steps(8);
    background: repeating-linear-gradient(45deg, var(--crimson) 0 8px, var(--pink) 8px 16px, var(--teal) 16px 24px);
    background-size:34px 100%; animation: slide 1.2s linear infinite; }
  @keyframes slide{ from{background-position-x:0;} to{background-position-x:34px;} }
  .hint{ font-size:11px; color:#b7a9bd; margin-bottom:14px; }

  .item-row{ display:flex; gap:10px; margin-bottom:12px; }
  .icon-box{ width:74px; height:74px; flex-shrink:0; background:#fdfdfd;
    display:flex; align-items:center; justify-content:center; position:relative; }
  .icon-box.locked{ border:2px dashed #ccc; }
  @keyframes glitchpop{
    0%{ transform:translate(-3px,2px) scale(.8); filter:hue-rotate(90deg) brightness(1.6); }
    40%{ transform:translate(3px,-2px) scale(1.05); }
    100%{ transform:translate(0,0) scale(1); filter:none; }
  }
  .icon-box .qmark{ font-family:'Press Start 2P', monospace; font-size:20px; color:#ccc; }
  .icon-box svg{ max-width:82%; max-height:82%; width:auto; height:auto; display:block; }
  .info-card{ flex:1; background:#fbfbfb; padding:9px 11px; min-width:0;
    display:flex; flex-direction:column; justify-content:center; cursor:default; }
  .info-card.locked{ border:1px solid #e4e4e4; cursor:pointer; }
  .pill{ font-family:'Press Start 2P', monospace; font-size:8px; color:#fff;
    padding:4px 7px; display:inline-block; align-self:flex-start; margin-bottom:6px; }
  .pill.ph{ background:#ddd; color:#999; }
  .trait{ font-family:'Press Start 2P', monospace; font-size:8px; margin-bottom:4px; }
  .desc{ font-size:12px; line-height:1.3; color:#3a3a3a; }
  .desc.placeholder{ color:#bbb; letter-spacing:2px; }

  .footer-msg{ margin-top:6px; text-align:center; font-family:'Press Start 2P', monospace;
    font-size:10px; color:#fff; background:linear-gradient(90deg,var(--teal),var(--pink),var(--crimson));
    background-size:200% 100%; padding:12px; letter-spacing:.5px; line-height:1.8; display:none; }
  .footer-msg.show{ display:block; animation: rainbow 3s linear infinite; }
  @keyframes rainbow{ from{background-position-x:0;} to{background-position-x:200%;} }
  .completed-note{ text-align:center; font-size:11px; color:#b7a9bd; margin-top:6px; }

  .bonus{ display:none; margin-top:20px; border-top:2px dashed var(--periwinkle); padding-top:16px; text-align:center; }
  .bonus.show{ display:block; }
  .bonus h2{ font-family:'Press Start 2P', monospace; font-size:11px; margin:0 0 10px; color:var(--crimson); line-height:1.8; }
  .roll-display{ font-family:'Press Start 2P', monospace; font-size:28px; width:96px; height:104px; margin:0 auto 12px;
    background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:center;
    clip-path: polygon(50% 0%, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%); position:relative; }
  .roll-display.locked{ background:#e4e4e4; color:#999; }
  .roll-display svg.lockicon{ width:34%; height:34%; }
  .bonus-lock{ margin-bottom:12px; }
  .bonus-lock input{ font-family:'Press Start 2P', monospace; font-size:16px; text-align:center; width:100px;
    padding:8px; border:2px solid var(--ink); letter-spacing:6px; margin-bottom:10px; }
  .bonus-lock-msg{ font-size:12px; margin-top:8px; min-height:16px; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
  .roll-btn{ font-family:'Press Start 2P', monospace; font-size:11px; background:var(--ink); color:#fff;
    border:none; padding:12px 16px; cursor:pointer; box-shadow:3px 3px 0 var(--teal); }
  .roll-btn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--teal); }
  .roll-btn:disabled{ opacity:.6; cursor:default; }
  .roll-result{ font-size:14px; margin-top:12px; line-height:1.5; }

  .toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; font-size:12px; padding:10px 16px; opacity:0; transition:all .25s ease;
    pointer-events:none; white-space:nowrap; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .soundtoggle{ display:flex; align-items:center; justify-content:center; margin:0; background:none;
    border:2px solid var(--ink); width:26px; height:26px; padding:0; cursor:pointer; }
  .resettoggle{ display:flex; align-items:center; justify-content:center; background:none;
    border:2px solid #ccc; color:#ccc; font-size:15px; width:26px; height:26px; padding:0; cursor:default;
    transition: all .2s ease; }
  .resettoggle.active{ border-color:var(--crimson); color:var(--crimson); cursor:pointer; }
</style>
</head>
<body>
<div class="console frame-2" id="console">
  <div class="titlebar">
    <div>
      <h1>JACOB'S<br>INVENTORY</h1>
      <div class="subtitle" id="subtitle">scan each gift to unlock</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:flex-end; gap:4px;">
      <div class="lvbadge">LV.26</div>
      <div style="display:flex; gap:4px;">
        <button class="soundtoggle" id="soundToggle" aria-label="toggle sound"></button>
        <button class="resettoggle" id="resetToggle" aria-label="reset inventory">↺</button>
      </div>
    </div>
  </div>
  <div class="xprow">XP&nbsp;<span id="xpVal">0</span>/2600<div class="xpbar"><div class="xpbar-fill" id="xpFill"></div></div></div>
  <div id="rows"></div>
  <div class="footer-msg" id="footerMsg">ALL ITEMS COLLECTED!<br>HAPPY BIRTHDAY, JACOB</div>
  <div class="completed-note" id="completedNote"></div>

  <div class="bonus" id="bonusSection">
    <h2>BONUS LEVEL:<br>ROLL FOR ADVANTAGE</h2>
    <div class="roll-display locked" id="rollDisplay"></div>
    <div class="bonus-lock" id="bonusLock">
      <input id="bonusCode" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="----">
      <br>
      <button class="roll-btn" id="bonusCodeSubmit">ENTER CODE</button>
      <div class="bonus-lock-msg" id="bonusLockMsg"></div>
    </div>
    <button class="roll-btn" id="rollBtn" style="display:none;">ROLL</button>
    <div class="roll-result" id="rollResult"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ---- Sound engine (8-bit style, no audio files needed) ----
const SOUND_KEY = 'jacobInventorySound_v1';
let soundOn = localStorage.getItem(SOUND_KEY) !== 'off';
let audioCtx = null;
function actx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function beep(freq, dur, type, vol, delay){
  if(!soundOn) return;
  type = type || 'square'; vol = vol == null ? 0.15 : vol; delay = delay || 0;
  const c = actx();
  const play = () => {
    const t0 = c.currentTime + delay;
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(t0); osc.stop(t0 + dur);
  };
  if(c.state === 'running'){ play(); }
  else { c.resume().then(play).catch(()=>{}); }
}
function playUnlockChime(){ beep(523,0.09); beep(659,0.09,'square',0.15,0.09); beep(784,0.16,'square',0.15,0.18); }
function playDenied(){ beep(160,0.14,'sawtooth',0.12); }
function playRollTick(){ beep(280 + Math.random()*220, 0.03, 'square', 0.05); }
function playRollResult(final){
  if(final === 20){ beep(523,0.1); beep(659,0.1,'square',0.15,0.1); beep(784,0.1,'square',0.15,0.2); beep(1046,0.28,'square',0.18,0.3); }
  else if(final >= 15){ beep(523,0.12); beep(784,0.22,'square',0.15,0.12); }
  else if(final >= 10){ beep(440,0.16); }
  else { beep(220,0.2,'sawtooth',0.12); beep(175,0.28,'sawtooth',0.12,0.15); }
}
function playCompleteFanfare(){ [523,659,784,1046].forEach((f,i)=>beep(f,0.2,'square',0.16,i*0.13)); }

let pendingAutoSound = null; // set to 'chime' or 'complete' when the page loads with a fresh unlock
function firePendingSound(){
  if(pendingAutoSound === 'complete') playCompleteFanfare();
  else if(pendingAutoSound === 'chime') playUnlockChime();
  pendingAutoSound = null;
}
function armPendingSound(){
  if(!pendingAutoSound) return;
  const c = actx();
  if(c.state === 'running'){ firePendingSound(); return; }
  const events = ['pointerdown','touchstart','keydown','click'];
  const fire = () => { firePendingSound(); events.forEach(ev => document.removeEventListener(ev, fire)); };
  events.forEach(ev => document.addEventListener(ev, fire, { once:true }));
}

const soundToggle = document.getElementById('soundToggle');
const SOUND_ON_ICON = `<svg viewBox="0 0 20 20" width="13" height="13"><polygon points="2,7 6,7 10,3 10,17 6,13 2,13" fill="${'#0a0a12'}"/><path d="M13,7 Q16,10 13,13" stroke="#0a0a12" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M15.5,4 Q20,10 15.5,16" stroke="#0a0a12" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>`;
const SOUND_OFF_ICON = `<svg viewBox="0 0 20 20" width="13" height="13"><polygon points="2,7 6,7 10,3 10,17 6,13 2,13" fill="${'#0a0a12'}"/><line x1="13" y1="6" x2="19" y2="14" stroke="#0a0a12" stroke-width="1.6" stroke-linecap="round"/><line x1="19" y1="6" x2="13" y2="14" stroke="#0a0a12" stroke-width="1.6" stroke-linecap="round"/></svg>`;
soundToggle.innerHTML = soundOn ? SOUND_ON_ICON : SOUND_OFF_ICON;
soundToggle.addEventListener('click', () => {
  soundOn = !soundOn;
  localStorage.setItem(SOUND_KEY, soundOn ? 'on' : 'off');
  soundToggle.innerHTML = soundOn ? SOUND_ON_ICON : SOUND_OFF_ICON;
  if(soundOn) beep(660, 0.08);
});

const resetToggle = document.getElementById('resetToggle');
resetToggle.addEventListener('click', () => {
  if(!resetToggle.classList.contains('active')) return;
  if(confirm('Reset the whole inventory back to locked? This cannot be undone.')){
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(COMPLETE_KEY);
    localStorage.removeItem(BONUS_KEY);
    location.href = location.pathname;
  }
});

const ITEMS = [
  { id:'introverted', letter:'I', name:'STEAM GIFT CARD', icon:'steam', desc:"To fuel your solo time + clear your game backlog.", trait:'INTROVERTED' },
  { id:'intuitive', letter:'N', name:'JACOB-ISMS D20', icon:'dice', desc:"Represents your approach to life, exploring connections and what-ifs, living for the future. Somehow, you always seem to roll with advantage.", trait:'INTUITIVE' },
  { id:'thinking', letter:'T', name:'PUZZLE BOX', icon:'puzzle', desc:"For your problem-solving brain. Solve to gain 650 XP.", trait:'THINKING' },

];
const STORAGE_KEY = 'jacobInventoryUnlocked_v1';
const COMPLETE_KEY = 'jacobInventoryCompletedAt_v1';
const BONUS_KEY = 'jacobBonusUnlocked_v1';

function getUnlocked(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }catch(e){ return []; }
}
function saveUnlocked(arr){ localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); }

const params = new URLSearchParams(location.search);
if(params.get('reset') === '1'){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(COMPLETE_KEY);
  localStorage.removeItem(BONUS_KEY);
}
let unlocked = getUnlocked();
let justUnlockedId = null;
const scanned = params.get('unlock');
if(scanned && ITEMS.some(it => it.id === scanned) && !unlocked.includes(scanned)){
  unlocked.push(scanned);
  saveUnlocked(unlocked);
  justUnlockedId = scanned;
}
if(unlocked.length > 0) resetToggle.classList.add('active');
// clean the URL so refreshing/sharing doesn't re-trigger the animation
if(scanned || params.get('reset')){
  history.replaceState({}, '', location.pathname);
}

const rows = document.getElementById('rows');
const xpVal = document.getElementById('xpVal');
const xpFill = document.getElementById('xpFill');
const footerMsg = document.getElementById('footerMsg');
const completedNote = document.getElementById('completedNote');
const consoleEl = document.getElementById('console');
const toast = document.getElementById('toast');
const bonusSection = document.getElementById('bonusSection');

function lockedMarkup(item){
  return `<div class="icon-box locked">${LOCKED_ICONS[item.icon]}</div>
  <div class="info-card locked"><span class="pill ph">???</span><div class="desc placeholder">???<br>???<br>???</div></div>`;
}
function unlockedMarkup(item){
  return `<div class="icon-box unlocked" style="border:2px solid ${COLORS[item.id]};box-shadow:0 0 14px ${COLORS[item.id]}55;">${ICONS[item.icon]}</div>
  <div class="info-card unlocked" style="border-left:4px solid ${COLORS[item.id]};"><span class="pill" style="background:${COLORS[item.id]};">${item.name}</span>
  <div class="trait" style="color:${COLORS[item.id]};">(${item.letter}) ${item.trait}</div><div class="desc">${item.desc}</div></div>`;
}

let toastTimer = null;
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toast.classList.remove('show'), 1800);
}

const tapState = {};
const TAP_TARGET = 6;
const TAP_WINDOW_MS = 3000;

function registerFallbackTap(item, row){
  const now = Date.now();
  const st = tapState[item.id] || { count:0, lastTime:0 };
  if(now - st.lastTime > TAP_WINDOW_MS){ st.count = 0; }
  st.count++;
  st.lastTime = now;
  tapState[item.id] = st;
  if(st.count >= TAP_TARGET){
    tapState[item.id] = { count:0, lastTime:0 };
    unlockItemLive(item, row);
  } else {
    const remaining = TAP_TARGET - st.count;
    showToast(remaining === 1 ? `\u{1F440} 1 more...` : '🔒 scan this gift to unlock');
  }
}

function unlockItemLive(item, row){
  if(unlocked.includes(item.id)) return;
  unlocked.push(item.id);
  saveUnlocked(unlocked);
  row.classList.add('opened');
  row.innerHTML = unlockedMarkup(item);
  const iconEl = row.querySelector('.icon-box');
  if(iconEl) iconEl.style.animation = 'glitchpop .35s steps(5)';
  playUnlockChime();

  const newXp = unlocked.length * 650;
  xpVal.textContent = newXp;
  xpFill.style.width = (newXp/2600*100) + '%';
  resetToggle.classList.add('active');

  if(unlocked.length === ITEMS.length){
    document.getElementById('subtitle').textContent = 'level cleared';
    footerMsg.classList.add('show');
    bonusSection.classList.add('show');
    let completedAt = localStorage.getItem(COMPLETE_KEY);
    if(!completedAt){
      completedAt = new Date().toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' });
      localStorage.setItem(COMPLETE_KEY, completedAt);
    }
    completedNote.textContent = 'Completed ' + completedAt;
    playCompleteFanfare();
  }
}

ITEMS.forEach(item=>{
  const row = document.createElement('div');
  row.className = 'item-row';
  row.dataset.id = item.id;
  if(unlocked.includes(item.id)){
    row.classList.add('opened');
    row.innerHTML = unlockedMarkup(item);
    if(item.id === justUnlockedId){
      row.querySelector('.icon-box').style.animation = 'glitchpop .35s steps(5)';
    }
  } else {
    row.innerHTML = lockedMarkup(item);
    row.addEventListener('click', () => { playDenied(); registerFallbackTap(item, row); });
  }
  rows.appendChild(row);
});

const xp = unlocked.length * 650;
xpVal.textContent = xp;
xpFill.style.width = (xp/2600*100) + '%';

if(unlocked.length === ITEMS.length){
  document.getElementById('subtitle').textContent = 'level cleared';
  footerMsg.classList.add('show');
  bonusSection.classList.add('show');
  let completedAt = localStorage.getItem(COMPLETE_KEY);
  if(!completedAt){
    completedAt = new Date().toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' });
    localStorage.setItem(COMPLETE_KEY, completedAt);
  }
  completedNote.textContent = 'Completed ' + completedAt;
  if(justUnlockedId) pendingAutoSound = 'complete';
} else if(justUnlockedId){
  pendingAutoSound = 'chime';
}
armPendingSound();

const bonusCodeSubmit = document.getElementById('bonusCodeSubmit');
const bonusLockMsg = document.getElementById('bonusLockMsg');
const LOCK_ICON = `<svg class="lockicon" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" fill="none" stroke="#999" stroke-width="1.8"/><path d="M8,11 V7 a4,4 0 0 1 8,0 v4" fill="none" stroke="#999" stroke-width="1.8"/></svg>`;

let bonusUnlocked = localStorage.getItem(BONUS_KEY) === '1';

function showBonusUnlocked(){
  bonusUnlocked = true;
  localStorage.setItem(BONUS_KEY, '1');
  bonusLock.style.display = 'none';
  rollBtn.style.display = 'inline-block';
  rollDisplay.classList.remove('locked');
  rollDisplay.style.animation = 'glitchpop .4s steps(6)';
  rollDisplay.textContent = '?';
}

if(bonusUnlocked){
  showBonusUnlocked();
} else {
  rollDisplay.innerHTML = LOCK_ICON;
  bonusCodeSubmit.addEventListener('click', () => {
    if(bonusCode.value === BONUS_CODE){
      playUnlockChime();
      bonusLockMsg.style.color = 'var(--teal)';
      bonusLockMsg.textContent = 'UNLOCKED';
      setTimeout(showBonusUnlocked, 400);
    } else {
      playDenied();
      bonusLockMsg.style.color = 'var(--crimson)';
      bonusLockMsg.textContent = 'INCORRECT CODE';
      bonusCode.style.animation = 'none';
      void bonusCode.offsetWidth;
      bonusCode.style.animation = 'shake .3s';
      bonusCode.value = '';
    }
  });
  bonusCode.addEventListener('keydown', (e) => { if(e.key === 'Enter') bonusCodeSubmit.click(); });
}

if(rollBtn){
  const PITY_KEY = 'jacobRollPityCount_v1';
  const PITY_LIMIT = 4;
  const BOOST_CHANCE = 0.15;

  function getPityCount(){
    const v = parseInt(localStorage.getItem(PITY_KEY) || '0', 10);
    return isNaN(v) ? 0 : v;
  }
  function setPityCount(n){ localStorage.setItem(PITY_KEY, String(n)); }

  rollBtn.addEventListener('click', () => {
    try { actx(); } catch(e){} // establish audio permission synchronously; never let this block the roll itself
    rollBtn.disabled = true;
    let ticks = 0;
    const spin = setInterval(() => {
      rollDisplay.textContent = (1 + Math.floor(Math.random()*20));
      playRollTick();
      ticks++;
      if(ticks > 14){
        clearInterval(spin);

        const pityCount = getPityCount();
        let final;
        if(pityCount >= PITY_LIMIT){
          final = 20;
        } else if(Math.random() < BOOST_CHANCE){
          final = 20;
        } else {
          const r1 = 1 + Math.floor(Math.random()*20);
          const r2 = 1 + Math.floor(Math.random()*20);
          final = Math.max(r1, r2);
        }
        setPityCount(final === 20 ? 0 : pityCount + 1);

        rollDisplay.textContent = final;
        playRollResult(final);
        let tier, msg, egg = '';
        if(final === 20){
          tier='CRITICAL HIT!'; msg='Nat 20. The universe loves you.';
          egg = '<br><br><a href="https://github.com/megamariko/jacob26" target="_blank" rel="noopener" style="font-family:\'Press Start 2P\', monospace; font-size:9px; color:var(--crimson);">??? a secret passage opened ???</a>';
        }
        else if(final >= 15){ tier='GREAT ROLL!'; msg='Rolled with advantage, as always.'; }
        else if(final >= 10){ tier='SOLID ROLL.'; msg='A respectable roll for a respectable age.'; }
        else{ tier="IT'S SO OVER..."; msg='Maybe bad rolls are good rolls on your birthday?'; }
        rollResult.innerHTML = `<strong>${tier}</strong><br>${msg}${egg}`;
        rollBtn.disabled = false;
        rollBtn.textContent = 'ROLL AGAIN';
      }
    }, 60);
  });
}
</script>
</body>
</html>
